tool_id: xl_pricing_tool
template: excel/templates/Template_XOL_Pricing_Tool.xlsm
objective_markers:
  - "<xl pricing>"
  - "<xl pricing tool>"
  - "<xol pricing>"
dispatch:
  active_sheet: "VBA passes the active worksheet name to R as context$active_sheet."
  dynamic_tabs: "Implemented tab actions read from and refresh back to the active worksheet. Original template tab names are fallback defaults for direct R calls without active_sheet."
actions:
  gather:
    status: generic_placeholder
  update:
    status: generic_placeholder
  build:
    status: generic_placeholder
  gnpi_gather:
    status: not_defined_when_gather_from_blank
  gnpi_update:
    status: implemented
  gnpi_build:
    status: not_defined
  agg_gather:
    status: not_defined_when_gather_from_blank
  agg_update:
    status: implemented
  agg_build:
    status: not_defined
  profile_gather:
    status: not_defined_when_gather_from_blank
  profile_update:
    status: implemented
  profile_build:
    status: planned
  riskfit_gather:
    status: not_defined_when_gather_from_blank
  riskfit_update:
    status: discussion
  riskfit_build:
    status: discussion
  cat_onlevel_gather:
    status: implemented
  cat_onlevel_update:
    status: implemented
  cat_onlevel_build:
    status: not_defined
  xlsimulation_gather:
    status: implemented
  xlsimulation_update:
    status: implemented
  xlsimulation_build:
    status: reserved
tabs:
  Input_GNPI:
    marker: "<<GNPI>>"
    gather:
      status: not_defined_when_gather_from_blank
    update:
      function: xl_pricing_tool_gnpi_update
      outputs:
        - _BERTToolkitTemp/xl_pricing_tool/gnpi/gnpi_level_data.csv
        - _BERTToolkitTemp/xl_pricing_tool/gnpi/gnpi_lob_comparison_data.csv
        - _BERTToolkitTemp/xl_pricing_tool/gnpi/gnpi_chart_config.csv
        - _BERTToolkitTemp/xl_pricing_tool/gnpi/gnpi_level_chart.png
        - _BERTToolkitTemp/xl_pricing_tool/gnpi/gnpi_lob_comparison_chart.png
    build:
      status: not_defined
    controls:
      start_year: Input_GNPI!L18
      start_year_label: Input_GNPI!K17
      aesthetics_panel: Input_GNPI!AA10:AB34
      level_chart_title: label "Level Chart Title" or "Chart 1 Title"
      level_chart_subtitle: label "Level Chart Subtitle" or "Chart 1 Subtitle"
      composition_chart_title: label "Composition Chart Title" or "Chart 2 Title"
      composition_chart_subtitle: label "Composition Chart Subtitle" or "Chart 2 Subtitle"
      actual_color: label "Actual Color"
      revised_color: label "Revised Color"
      estimate_color: label "Estimate Color"
      label_color: label "Label Color" or "Font Color"
      grid_color: label "Grid Color"
      png_width: label "PNG Width" or "Chart Width"
      png_height: label "PNG Height" or "Chart Height"
      font_scale: label "Font Scale"
      label_font_size: label "Label Font Size" or "Data Label Font Size"
      axis_font_size: label "Axis Font Size"
      title_font_size: label "Title Font Size"
      lob_palette: labels "LOB Color 1" through "LOB Color 12"
      lob_sequence_start: Input_GNPI!L39
  Input_Agg:
    marker: "<<Agg>>"
    gather:
      status: not_defined_when_gather_from_blank
    update:
      function: xl_pricing_tool_agg_update
      status: implemented
      outputs:
        - _BERTToolkitTemp/xl_pricing_tool/agg/agg_output.csv
      excel_post_process:
        function: BTK_RefreshAggOutput
        target_range: Input_Agg!AH18:AK...
        mode: overwrite_output_block
    build:
      status: not_defined
    inputs:
      aggregate_table:
        range: Input_Agg!B12:S...
        required_columns:
          - Peril
          - Province
        year_columns: row 12 numeric year headers
      keyzone_table:
        range: Control_Module!K15:O...
        columns:
          - Province
          - Peril
          - AIR
          - RMS
          - Blended
    rules:
      supported_perils:
        - EQ
        - WF
      methods:
        - Nationwide
        - AIR
        - RMS
        - Blended
      keyzone_flags: "1 includes; blank or zero excludes"
      blended: explicit flag only
      prior_year: RNL_Year - 2
      current_year: RNL_Year - 1
      charts: none
  Input_Profile:
    marker: "<<Profile>>"
    gather:
      status: not_defined_when_gather_from_blank
    update:
      function: xl_pricing_tool_profile_update
      status: implemented
      outputs:
        - _BERTToolkitTemp/xl_pricing_tool/profile/profile_output.csv
        - _BERTToolkitTemp/xl_pricing_tool/profile/profile_si_composition_data.csv
        - _BERTToolkitTemp/xl_pricing_tool/profile/profile_si_composition_chart.png
      excel_post_process:
        function: BTK_RefreshProfileOutput
        target_range: Input_Profile!BH12:BS...
        mode: overwrite_output_block_and_insert_chart
    build:
      function: xl_pricing_tool_profile_build
      status: implemented
      purpose: "Generate XLsimulation-compatible CDF loss cause source blocks from exposure profiles, ELR, subject premium, MBBEFD curves, and ILF curves."
      outputs:
        - _BERTToolkitTemp/xl_pricing_tool/profile/build/<LossCause>_cdf.csv
    inputs:
      risk_profile_table:
        range: Input_Profile!B12:I...
        required_columns:
          - AsAt
          - UY
          - LOB
          - Nrisk
          - SI
          - Premium
          - Incurred
          - Remarks
      layer_table:
        range: Input_Profile!X13:AC...
        required_columns:
          - LayerID
          - Limit
          - Deductible
          - LayerName
          - Prior_LOBs
          - Current_LOBs
      parameter_table:
        range: Input_Profile!M12:U...
        used_columns:
          - LOB
          - LossCause
          - ELR
          - SubjectPrem
          - ActualPrem
          - Curve
          - CurrencyAdj
          - b
          - g
      build_controls:
        range: Input_Profile!M4:M6
        fields:
          - Minimum Loss / threshold
          - Loss Cap
          - Percentile Steps
      mb_curves:
        range: MBCurves!A3:C...
        columns:
          - Curve
          - b
          - g
      ilf_curves:
        range: ILFCurves!A1:AD...
        columns:
          - Curve
          - LOB
          - Default
          - State
          - Table
          - GCIdx
          - mu_1..mu_12
          - w_1..w_12
      chart_band_cuts:
        range: Input_Profile!K37:K44
        rule: "Band Cut label and trailing blanks are allowed. Nonblank cut values must be numeric and nonnegative, and at least two unique cut points must be present."
      chart_facets:
        range: Input_Profile!K47:K55
        rule: "Optional. Blank means all LOBs. A header value of LOB is ignored. Facet specs can use comma, slash, or semicolon delimiters."
    rules:
      expo_in_layer: "Nrisk * min(max((SI / Nrisk) - Deductible, 0), Limit)"
      adj_expo_in_layer: "expo_in_layer * SubjectPrem / ActualPrem"
      coverage_lob_delimiters: "comma, slash, semicolon"
      blank_coverage_lobs: include_all_lobs
      build_expected_loss: "SubjectPrem * ELR"
      build_mean_frequency: "ExpectedLoss / ConditionalMeanSeverity"
      build_percentile_rows: "Percentile Steps + 1, including 0 and 1"
      build_threshold: "Losses below Minimum Loss are ignored rather than floored; generated CDF is conditional on exceeding Minimum Loss."
      si_composition_chart: "100% stacked bar chart by AsAt, faceted by K47:K55 LOB specs, with Avg_SI bands from K37:K44."
      output_scope: "Only BG:BT / BH:BS R output block is overwritten by VBA."
  Risk Loss Fitting:
    marker: "<<RiskFit>>"
    gather:
      status: not_defined_when_gather_from_blank
    update:
      status: implemented_mle_diagnostics_stage
      proposed_action: riskfit_update
      purpose: "Produce loss comparison charts, weighted MLE severity fits, and prior/current CDF diagnostics. Frequency remains owned by workbook formulas."
      outputs:
        - _BERTToolkitTemp/xl_pricing_tool/riskfit/riskfit_loss_comparison_data.csv
        - _BERTToolkitTemp/xl_pricing_tool/riskfit/riskfit_fit_summary.csv
        - _BERTToolkitTemp/xl_pricing_tool/riskfit/riskfit_fit_parameters.csv
        - _BERTToolkitTemp/xl_pricing_tool/riskfit/riskfit_final_incurred_loss_chart.png
        - _BERTToolkitTemp/xl_pricing_tool/riskfit/riskfit_actual_incurred_loss_chart.png
        - _BERTToolkitTemp/xl_pricing_tool/riskfit/riskfit_pareto_cdf_chart.png
        - _BERTToolkitTemp/xl_pricing_tool/riskfit/riskfit_loggamma_cdf_chart.png
        - _BERTToolkitTemp/xl_pricing_tool/riskfit/riskfit_weibull_cdf_chart.png
        - _BERTToolkitTemp/xl_pricing_tool/riskfit/riskfit_lognormal_cdf_chart.png
        - _BERTToolkitTemp/xl_pricing_tool/riskfit/riskfit_gamma_cdf_chart.png
        - _BERTToolkitTemp/xl_pricing_tool/riskfit/riskfit_loglogistic_cdf_chart.png
      excel_post_process:
        function: BTK_RefreshRiskFitCharts
        target_range: "'Risk Loss Fitting'!R54:AK98 and distribution CDF chart blocks"
        mode: "load_fit_csvs_to_r_output_area_and_insert_charts"
      current_r_output:
        range: "'Risk Loss Fitting'!BN12:BO14"
        columns:
          - AsAt
          - Alpha
      current_r_input:
        range: "'Risk Loss Fitting'!BI12:BL14"
        columns:
          - AsAt
          - LossCause
          - lambda
          - alpha
    build:
      status: not_defined
      purpose: "No build action is defined for this tab."
    inputs:
      loss_table:
        range: "'Risk Loss Fitting'!B12:P..."
        required_columns:
          - AsAt
          - ClaimID
          - LOB
          - Insured
          - AY
          - TreatyYear
          - Actual_Incurred
          - OnLevel_Incurred
          - ReturnPeriod
          - OriginalRate
          - GNPI_Scale
          - RP_Scale
          - FinalRate
          - Sev_Trend
          - Final_Incurred
      specifications:
        range: "'Risk Loss Fitting'!R5:S7"
        fields:
          - Min
          - Max
          - StartYear
      toggles:
        range: "'Risk Loss Fitting'!V5:W7"
        fields:
          - Inflation Trend Sev.
          - GNPI adj. Sev. Occ.
          - Customized R.P.
      fit_selection:
        range: "'Risk Loss Fitting'!BI12:BL14"
        fields:
          - AsAt
          - LossCause
          - lambda
          - alpha
      chart_filters:
        loss_comparison:
          filter_range: "'Risk Loss Fitting'!S56:T58"
          title_range: "'Risk Loss Fitting'!Y56:Z58"
          layer_range: "'Risk Loss Fitting'!S61:T..."
          output_canvas: "'Risk Loss Fitting'!R54:AK98"
        cdf_filter: "'Risk Loss Fitting'!AH12:AI15"
        loss_filter: "'Risk Loss Fitting'!AH39:AI42"
        layer_filter: "'Risk Loss Fitting'!AH44:AI49"
    existing_excel_calculations:
      exposure: "'Risk Loss Fitting'!R14:T32"
      counts: "'Risk Loss Fitting'!V14:W33"
      adjusted_frequency: "'Risk Loss Fitting'!Y14:Z35"
      severity_comparison: "'Risk Loss Fitting'!AB17:AE21"
    rules:
      supported_asat:
        - Prior
        - Current
      frequency_owner: Excel
      severity_owner: R
      update_scope: "Fits severity distributions using Final_Incurred as the loss and FinalRate as the observation weight. Frequency remains calculated by workbook formulas."
      loss_comparison_chart: "Two separate individual-loss charts. TreatyYear is the facet, losses are columns, and Prior/Current are side-by-side. Final chart uses Final_Incurred; optional actual chart uses Actual_Incurred. Layer structure controls y-axis maximum and background bands only. PNG width dynamically expands with the number of losses/facets, and VBA anchors charts at X61 and X94 while preserving aspect ratio."
      severity_fitting:
        loss: Final_Incurred
        weight: FinalRate
        likelihood: "sum(FinalRate * log density(Final_Incurred | theta))"
        empirical_cdf: "weighted by FinalRate"
        pareto_threshold: "fixed to the user's minimum loss threshold"
        output_area: "'Risk Loss Fitting'!CG7:DA..."
        distribution_blocks: "Excel-owned formulas in AQ:CC; VBA does not overwrite these cells."
      severity_distributions_supported:
        - Pareto
        - Lognormal
        - Gamma
        - Loggamma
        - Weibull
        - Loglogistic
  CatLossOnLevel:
    marker: "<<CatOnLevel>>"
    gather:
      function: xl_pricing_tool_cat_onlevel_gather
      status: implemented
      purpose: "Validate external GNPI, CPI, and aggregate source tabs before CAT on-level calculations."
      source_tab_controls:
        gnpi: CatLossOnLevel!C6
        cpi: CatLossOnLevel!C7
        aggregate: CatLossOnLevel!C8
      validations:
        - "C6:C8 must be filled."
        - "Configured source tabs must exist in the active workbook."
        - "GNPI source must have expected B12:I12 headers and non-empty B13:I data."
        - "CPI source must have expected E15:H15 headers and non-empty E16:H data."
        - "Aggregate source must have expected B12:S12 headers and non-empty B13:S data."
      output_scope: "No workbook ranges are overwritten by gather."
    update:
      function: xl_pricing_tool_cat_onlevel_update
      status: implemented
      purpose: "Calculate CatLossOnLevel from/to exposure factors using the active sheet and configured source tabs."
      output_scope: "Only T13:U... is overwritten by the VBA refresh step."
      supported_methods:
        - "Province: sums aggregate exposure by listed provinces, peril, from/to years."
        - "Nationwide: sums all aggregate provinces for the row peril."
        - "Keyzone: sums aggregate provinces flagged as blended keyzone rows in the configured control/CPI tab."
        - "User-defined: first-pass placeholder treated as No On-level, returning 1 and 1 with a warning."
        - "No On-level: returns 1 and 1."
        - "GNPI: looks up GNPI from the configured GNPI tab, with Actual/Revised/Estimate priority by year."
        - "CPI: returns from=1 and to=the CPI factor for the row AsAt and from_year."
      source_tab_controls:
        gnpi: CatLossOnLevel!C6
        cpi: CatLossOnLevel!C7
        aggregate: CatLossOnLevel!C8
      output_files:
        cat_onlevel_output: cat_onlevel/cat_onlevel_output.csv
    build:
      status: not_defined
required_sheets:
  - Control_Module
  - Input_GNPI
  - Input_Agg
  - Input_Layers
  - Input_Profile
  - Portfolio
  - Risk Loss Fitting
  - PriceSelection_Risk
  - PriceTable_Risk
  - Input - Cat ELTs
  - PriceSelection_CAT
  - PriceTable_CAT
