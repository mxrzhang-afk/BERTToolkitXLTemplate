tool_id: xl_pricing_tool
template: excel/templates/Template_XOL_Pricing_Tool.xlsm
objective_markers:
  - "<xl pricing>"
  - "<xl pricing tool>"
  - "<xol pricing>"
actions:
  gather:
    status: generic_placeholder
  update:
    status: generic_placeholder
  build:
    status: generic_placeholder
  gnpi_gather:
    status: not_defined_when_gather_from_blank
  gnpi_update:
    status: implemented
  gnpi_build:
    status: not_defined
  agg_gather:
    status: not_defined_when_gather_from_blank
  agg_update:
    status: planned
  agg_build:
    status: not_defined
tabs:
  Input_GNPI:
    marker: "<<GNPI>>"
    gather:
      status: not_defined_when_gather_from_blank
    update:
      function: xl_pricing_tool_gnpi_update
      outputs:
        - _BERTToolkitTemp/xl_pricing_tool/gnpi/gnpi_level_data.csv
        - _BERTToolkitTemp/xl_pricing_tool/gnpi/gnpi_lob_comparison_data.csv
        - _BERTToolkitTemp/xl_pricing_tool/gnpi/gnpi_chart_config.csv
        - _BERTToolkitTemp/xl_pricing_tool/gnpi/gnpi_level_chart.png
        - _BERTToolkitTemp/xl_pricing_tool/gnpi/gnpi_lob_comparison_chart.png
    build:
      status: not_defined
    controls:
      start_year: Input_GNPI!L18
      start_year_label: Input_GNPI!K17
      aesthetics_panel: Input_GNPI!AA10:AB34
      level_chart_title: label "Level Chart Title" or "Chart 1 Title"
      level_chart_subtitle: label "Level Chart Subtitle" or "Chart 1 Subtitle"
      composition_chart_title: label "Composition Chart Title" or "Chart 2 Title"
      composition_chart_subtitle: label "Composition Chart Subtitle" or "Chart 2 Subtitle"
      actual_color: label "Actual Color"
      revised_color: label "Revised Color"
      estimate_color: label "Estimate Color"
      label_color: label "Label Color" or "Font Color"
      grid_color: label "Grid Color"
      png_width: label "PNG Width" or "Chart Width"
      png_height: label "PNG Height" or "Chart Height"
      font_scale: label "Font Scale"
      label_font_size: label "Label Font Size" or "Data Label Font Size"
      axis_font_size: label "Axis Font Size"
      title_font_size: label "Title Font Size"
      lob_palette: labels "LOB Color 1" through "LOB Color 12"
      lob_sequence_start: Input_GNPI!L39
  Input_Agg:
    marker: "<<Agg>>"
    gather:
      status: not_defined_when_gather_from_blank
    update:
      function: xl_pricing_tool_agg_update
      status: planned
      outputs:
        - _BERTToolkitTemp/xl_pricing_tool/agg/agg_output.csv
      excel_post_process:
        function: BTK_RefreshAggOutput
        target_range: Input_Agg!AH18:AK...
        mode: overwrite_output_block
    build:
      status: not_defined
    inputs:
      aggregate_table:
        range: Input_Agg!B12:S...
        required_columns:
          - Peril
          - Province
        year_columns: row 12 numeric year headers
      keyzone_table:
        range: Control_Module!K15:O...
        columns:
          - Province
          - Peril
          - AIR
          - RMS
          - Blended
    rules:
      supported_perils:
        - EQ
        - WF
      methods:
        - Nationwide
        - AIR
        - RMS
        - Blended
      keyzone_flags: "1 includes; blank or zero excludes"
      blended: explicit flag only
      prior_year: RNL_Year - 2
      current_year: RNL_Year - 1
      charts: none
required_sheets:
  - Control_Module
  - Input_GNPI
  - Input_Agg
  - Input_Layers
  - Input_Portfolio
  - Portfolio
  - Risk Loss Fitting
  - PriceSelection_Risk
  - PriceTable_Risk
  - Input - Cat ELTs
  - PriceSelection_CAT
  - PriceTable_CAT
